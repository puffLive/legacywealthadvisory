<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">A compass guiding financial planning</title><desc id="desc">A gold compass on a navy landscape symbolizing direction, protection and long-term goals.</desc><defs><linearGradient id="sky" x2=".8" y2="1"><stop stop-color="#132e4b"/><stop offset=".55" stop-color="#315373"/><stop offset="1" stop-color="#d8ad70"/></linearGradient><radialGradient id="dial"><stop stop-color="#214463"/><stop offset="1" stop-color="#091c31"/></radialGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f8dd9a"/><stop offset=".5" stop-color="#b57c31"/><stop offset="1" stop-color="#f2cc78"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1000" height="900" fill="url(#sky)"/><circle cx="800" cy="195" r="78" fill="#f5d7a3" opacity=".75"/><path d="M0 490 170 335 320 460 505 260 705 475 840 350 1000 480V900H0Z" fill="#172f47" opacity=".75"/><path d="M0 620 240 490 430 590 690 425 1000 610V900H0Z" fill="#10283e" opacity=".88"/><ellipse cx="545" cy="740" rx="350" ry="100" fill="#081727" opacity=".55" filter="url(#shadow)"/><g transform="translate(550 510) rotate(-13)"><circle r="318" fill="#071b30" stroke="url(#gold)" stroke-width="33"/><circle r="288" fill="url(#dial)" stroke="#f0cb82" stroke-width="4"/><circle r="244" fill="none" stroke="#d5b576" stroke-opacity=".55" stroke-width="2"/><circle r="167" fill="none" stroke="#b8cad6" stroke-opacity=".28" stroke-width="2"/><g stroke="#e4d4b0" stroke-width="3" opacity=".8"><path d="M0-270V-244M0 270V244M-270 0h26M270 0h-26M-191-191l17 17M191 191l-17-17M191-191l-17 17M-191 191l17-17"/></g><g fill="#f5e7cb" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="middle"><text x="0" y="-202">GOALS</text><text x="200" y="8" font-size="22">PROTECT</text><text x="0" y="231">RETIRE</text><text x="-200" y="8" font-size="22">BUILD</text></g><path d="M0-162 2